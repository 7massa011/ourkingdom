<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>our kindom</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #050505; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        #star-canvas { position: fixed; inset: 0; z-index: -1; }
        
        /* العداد المطور */
        .counter-container { 
            margin-top: 30px; 
            text-align: center; 
            background: rgba(255, 255, 255, 0.03); 
            padding: 25px; 
            border-radius: 30px; 
            backdrop-filter: blur(15px); 
            width: 85%; 
            max-width: 800px; 
            z-index: 10; 
            border: 1px solid rgba(255, 51, 51, 0.2); 
            box-shadow: 0 0 25px rgba(255, 51, 51, 0.15);
        }

        .start-date-label {
            display: block;
            font-size: 1.1rem;
            color: #ff3333;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
        }

        .timer { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        
        .time-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 15px;
            min-width: 80px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .number { 
            font-size: 2.5rem; 
            font-weight: 900; 
            background: linear-gradient(180deg, #ff3333, #ff8888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(255, 51, 51, 0.6));
            font-family: 'Courier New', monospace;
        }

        .label { font-size: 0.8rem; display: block; margin-top: 5px; color: #ccc; font-weight: 500; }

        /* الأقسام */
        .selection-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 50px; z-index: 10; width: 90%; max-width: 500px; }
        .choice-card { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 20px; text-align: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .choice-card:hover { border-color: #ff3333; transform: scale(1.05); }
        .choice-card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #ff3333; margin-bottom: 10px; }
        .full-width-card { grid-column: 1 / span 2; justify-self: center; width: 180px; }

        /* المعرض */
        .section-content { width: 95%; max-width: 1200px; z-index: 10; display: none; padding: 20px; }
        .header-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 15px; backdrop-filter: blur(10px); }
        .btn { padding: 10px 22px; border-radius: 25px; cursor: pointer; font-weight: bold; border: none; transition: 0.2s; }
        .btn-save { background: #28a745; color: white; }

        .gallery-grid { 
    display: grid; 
    /* التعديل هنا: صورتين في الموبايل ويزيدوا في الكمبيوتر */
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); 
    grid-gap: 12px; 
    width: 100%; 
    padding: 10px;
}

/* تعديل حجم الكارت ليناسب الموبايل */
.img-card { 
    position: relative; 
    background: #111; 
    border-radius: 12px; 
    overflow: hidden; 
    border: 1px solid rgba(255, 255, 255, 0.1); 
    cursor: zoom-in;
    /* لجعل الصور متناسقة في الطول */
    aspect-ratio: 1 / 1; 
}

.img-card img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; /* ده هيخلي الصور كلها نفس الحجم والبرواز */
}
        
        .delete-btn { position: absolute; top: 8px; left: 8px; background: rgba(255, 0, 0, 0.85); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; z-index: 10; }

        /* Lightbox */
        #lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 20px; }
        #lightbox img { max-width: 95%; max-height: 90vh; border-radius: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .close-lightbox { position: absolute; top: 20px; right: 30px; font-size: 40px; color: white; cursor: pointer; font-weight: bold; }

        #login-overlay { position: fixed; inset: 0; background: black; display: flex; justify-content: center; align-items: center; z-index: 1000; }
    </style>
</head>
<body>

    <canvas id="star-canvas"></canvas>

    <div id="login-overlay">
        <div style="text-align: center; background: #0f0f0f; padding: 40px; border-radius: 25px; border: 1px solid #ff3333;">
            <h2 style="color: #ff3333; margin-bottom: 20px;">our kindom</h2>
            <input type="password" id="pass-input" style="padding:12px; border-radius:12px; border:1px solid #333; background:#000; color:#fff; text-align:center;" placeholder="كلمة السر">
            <br>
            <button class="btn" style="background:#ff3333; color:white; margin-top:20px; width: 100%;" onclick="checkPass()">دخول</button>
        </div>
    </div>

    <div id="lightbox" onclick="closeImage()">
        <span class="close-lightbox">&times;</span>
        <img id="lightbox-img" src="">
    </div>

    <div id="main-content" style="display: none; width: 100%; flex-direction: column; align-items: center;">
        <div class="counter-container">
            <span class="start-date-label">منذ 30/9/2024</span>
            <div class="timer" id="timer-display"></div>
        </div>

        <div id="main-selection" class="selection-container">
            <div class="choice-card" onclick="openSection('zoele')"><img src="pic/ملك.jpeg"><h3>زوئله</h3></div>
            <div class="choice-card" onclick="openSection('mohammed')"><img src="pic/محمد.jpeg"><h3>محمد</h3></div>
            <div class="choice-card full-width-card" onclick="openSection('both')"><img src="pic/3.jpeg"><h3>محمد وزوئله</h3></div>
        </div>

        <div id="section-viewer" class="section-content">
            <div class="header-controls">
                <button class="btn" style="background:#444; color:white" onclick="backToHome()">← رجوع</button>
                <button class="btn btn-save" onclick="alert('تم تحديث الذاكرة!')">حفظ الكل</button>
            </div>
            
            <input type="file" id="file-input" style="display: none" accept="image/*" multiple onchange="handleFiles(this)">
            <button class="btn" style="background:#ff3333; color:white; margin:0 auto 20px; display:block;" onclick="document.getElementById('file-input').click()">+ أضف صورك هنا</button>

            <div id="unified-gallery" class="gallery-grid"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBRMSmuIAybTYhZE6W9txp13oeq4c6uyWA", projectId: "ourkingdom-49c76" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentSection = '';
        let isAdmin = false;
        let unsubscribe = null;

        function checkPass() {
            const p = document.getElementById('pass-input').value;
            if(p === '309' || p === '4047') {
                isAdmin = (p === '4047');
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'flex';
                initStars(); updateTimer(); setInterval(updateTimer, 1000);
            } else { alert('كلمة السر خطأ'); }
        }

        function expandImage(url) {
            document.getElementById('lightbox-img').src = url;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeImage() { document.getElementById('lightbox').style.display = 'none'; }

        function handleFiles(input) {
            const files = Array.from(input.files);
            files.forEach(file => {
                const tempId = 'local-' + Date.now() + Math.random();
                addPhotoToUI({ url: URL.createObjectURL(file), id: tempId, isLocal: true });
                uploadToCloudinary(file, tempId);
            });
            input.value = '';
        }

        async function uploadToCloudinary(file, tempId) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'storyyyy');
            try {
                const res = await fetch(`https://api.cloudinary.com/v1_1/dox3j4ds0/image/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                if (data.secure_url) {
                    await db.collection('photos').add({
                        url: data.secure_url,
                        section: currentSection,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
            } catch (e) { console.error("Upload error"); }
        }

        function addPhotoToUI(photo) {
            const container = document.getElementById('unified-gallery');
            const card = document.createElement('div');
            card.className = 'img-card';
            if(photo.isLocal) card.id = photo.id;
            card.innerHTML = `
                ${(isAdmin && !photo.isLocal) ? `<button class="delete-btn" onclick="event.stopPropagation(); deletePhoto('${photo.id}')">×</button>` : ''}
                <img src="${photo.url}" onclick="expandImage('${photo.url}')">
            `;
            if(photo.isLocal) container.prepend(card);
            else container.appendChild(card);
        }

        function startSync() {
            if(unsubscribe) unsubscribe();
            const container = document.getElementById('unified-gallery');
            unsubscribe = db.collection('photos')
                .where('section', '==', currentSection)
                .orderBy('createdAt', 'desc')
                .onSnapshot(snap => {
                    const localCards = Array.from(container.querySelectorAll('[id^="local-"]'));
                    container.innerHTML = '';
                    localCards.forEach(c => container.appendChild(c));
                    snap.forEach(doc => {
                        const data = doc.data();
                        addPhotoToUI({ url: data.url, id: doc.id, isLocal: false });
                    });
                });
        }

        async function deletePhoto(id) { if(confirm('حذف نهائي؟')) await db.collection('photos').doc(id).delete(); }

        function openSection(sec) {
            currentSection = sec;
            document.getElementById('main-selection').style.display = 'none';
            document.getElementById('section-viewer').style.display = 'block';
            document.getElementById('unified-gallery').innerHTML = '';
            startSync();
        }

        function backToHome() {
            document.getElementById('main-selection').style.display = 'grid';
            document.getElementById('section-viewer').style.display = 'none';
        }

        const startDate = new Date('2024-09-30T00:00:00');
        function updateTimer() {
            const now = new Date();
            let y = now.getFullYear() - startDate.getFullYear();
            let m = now.getMonth() - startDate.getMonth();
            let d = now.getDate() - startDate.getDate();
            let hh = now.getHours() - startDate.getHours();
            let mm = now.getMinutes() - startDate.getMinutes();
            let ss = now.getSeconds() - startDate.getSeconds();
            if(ss<0){ ss+=60; mm--; } if(mm<0){ mm+=60; hh--; } if(hh<0){ hh+=24; d--; }
            if(d<0){ d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); m--; }
            if(m<0){ m+=12; y--; }
            document.getElementById('timer-display').innerHTML = `
                <div class="time-box"><span class="number">${y}</span><span class="label">سنة</span></div>
                <div class="time-box"><span class="number">${m}</span><span class="label">شهر</span></div>
                <div class="time-box"><span class="number">${d}</span><span class="label">يوم</span></div>
                <div class="time-box"><span class="number">${hh}</span><span class="label">ساعة</span></div>
                <div class="time-box"><span class="number">${mm}</span><span class="label">دقيقة</span></div>
                <div class="time-box"><span class="number">${ss}</span><span class="label">ثانية</span></div>
            `;
        }

        function initStars() {
            const canvas = document.getElementById('star-canvas'); const ctx = canvas.getContext('2d');
            let stars = []; canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            for(let i=0; i<150; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*2, speed: Math.random()*0.3});
            function draw() { ctx.clearRect(0,0,canvas.width, canvas.height); ctx.fillStyle = 'white'; stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill(); s.y += s.speed; if(s.y > canvas.height) s.y=0; }); requestAnimationFrame(draw); } draw();
        }
    </script>
</body>
</html>
